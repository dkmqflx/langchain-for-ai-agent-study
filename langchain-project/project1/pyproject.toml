[project]
name = "p1-rag-service"
version = "0.1.0"
description = "P1 · 프로덕션급 RAG 문서 검색 서비스 (LangChain 1.x + FastAPI + Langfuse + RAGAS)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.0",
    "fastapi>=0.139.2",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    # 0.4.2에서 chat_models.vertexai 모듈이 제거됐는데 ragas 0.4.3이 이를 하드 임포트해 import 실패.
    # 0.4.1은 langchain 1.x와 호환되면서 해당 모듈이 남아 있어 0.4.1로 고정한다. (ragas 상향 시 재검토)
    "langchain-community>=0.4.1,<0.4.2",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.0",
    "pandas>=3.0.3",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.0",
    "uvicorn[standard]>=0.51.0",
]
